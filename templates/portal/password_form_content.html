<div class="mx-auto max-w-2xl">
    <h1 class="text-3xl font-black">تغيير كلمة المرور</h1>
    <form method="post" class="mt-8 space-y-5 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        {% csrf_token %}
        {% for field in form %}
            <div><label class="text-sm font-black" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="mt-2 text-sm font-bold text-rose-600">{{ error }}</p>{% endfor %}</div>
        {% endfor %}
        <button class="w-full rounded-xl bg-slate-950 px-5 py-3.5 font-black text-white">تغيير كلمة المرور</button>
    </form>
</div>
