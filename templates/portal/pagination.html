{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-7 flex items-center justify-center gap-2" aria-label="صفحات النتائج">
    {% if page_obj.has_previous %}<a class="rounded-xl border border-slate-200 bg-white px-4 py-2 font-bold" href="?q={{ query|urlencode }}&status={{ selected_status|urlencode }}&page={{ page_obj.previous_page_number }}">السابق</a>{% endif %}
    <span class="px-3 text-sm text-slate-500">صفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="rounded-xl border border-slate-200 bg-white px-4 py-2 font-bold" href="?q={{ query|urlencode }}&status={{ selected_status|urlencode }}&page={{ page_obj.next_page_number }}">التالي</a>{% endif %}
</nav>
{% endif %}
