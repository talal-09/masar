{% extends "portal/base.html" %}
{% block title %}حذف السيارة{% endblock %}
{% block content %}
    <div class="mx-auto max-w-lg rounded-3xl border border-rose-200 bg-white p-8 text-center shadow-sm">
        <h1 class="text-2xl font-black">حذف {{ vehicle }}</h1>
        <p class="mt-3 text-slate-500">سيتم حذف السيارة نهائيًا إذا لم يكن عليها أمر صيانة نشط.</p>
        <form method="post" class="mt-7">{% csrf_token %}<button class="rounded-xl bg-rose-600 px-6 py-3 font-black text-white">تأكيد الحذف</button></form>
    </div>
{% endblock %}
