{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block error_title %}تعذر إكمال الطلب{% endblock %} | مَسَار</title>
    <link rel="icon" href="{% static 'images/masar_logo.png' %}" type="image/png">
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#faf8f2;color:#0a3942;font-family:Tahoma,Arial,sans-serif}.card{width:min(620px,100%);padding:42px 28px;text-align:center;background:#fffdf8;border:1px solid #ded4c1;border-radius:28px;box-shadow:0 24px 70px rgba(5,47,56,.1)}img{width:180px;height:88px;object-fit:cover;transform:scale(1.25)}.code{margin:18px 0 4px;color:#ad8f50;font-size:54px;font-weight:900}h1{margin:0;font-size:clamp(25px,5vw,38px)}p{color:#64748b;line-height:1.9}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:25px}.btn{min-height:46px;padding:12px 20px;border:0;border-radius:13px;text-decoration:none;font:700 15px Tahoma;color:white;background:#0a3942;cursor:pointer}.secondary{color:#0a3942;background:#f2eee4}@media(max-width:480px){.card{padding:30px 18px}.btn{width:100%}}
    </style>
</head>
<body><main class="card"><a href="{% url 'home' %}"><img src="{% static 'images/masar_logo.png' %}" alt="مَسَار"></a><div class="code">{% block error_code %}{% endblock %}</div><h1>{% block error_heading %}{% endblock %}</h1><p>{% block error_message %}{% endblock %}</p><div class="actions"><a class="btn" href="{% url 'home' %}">الصفحة الرئيسية</a><button class="btn secondary" type="button" onclick="history.back()">العودة للخلف</button>{% block error_actions %}{% endblock %}</div></main></body>
</html>
